name: webtoon-review

x-backend-environment: &backend-environment
  MYSQL_DATABASE_HOST: mysql
  MYSQL_DATABASE_PORT: 3306
  MYSQL_DATABASE_NAME: ${MYSQL_DATABASE_NAME}
  MYSQL_USERNAME: ${MYSQL_USERNAME}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  MONGODB_HOST: mongodb
  MONGODB_PORT: 27017
  JWT_KEY: ${JWT_KEY}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
  LOKI_URL: http://loki:3100/loki/api/v1/push
  QUEUE_LOG_DIRECTORY: /app/logs

x-backend-common: &backend-common
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    mongodb:
      condition: service_healthy

x-root-backend-common: &root-backend-common
  <<: *backend-common
  build:
    context: .
    target: root-runtime
  image: webtoon-review-backend:local

x-chat-environment: &chat-environment
  <<: *backend-environment
  SPRING_PROFILES_ACTIVE: chat
  CHAT_MESSAGE_QUERY_DISTRIBUTED_LOCK_ENABLED: ${CHAT_MESSAGE_QUERY_DISTRIBUTED_LOCK_ENABLED:-true}

x-chat-common: &chat-common
  <<: *backend-common
  build:
    context: .
    target: chat-connection-runtime
  image: webtoon-review-chat-connection:local
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 30s

services:
  mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE_NAME}
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_DATABASE_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4.10-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:8.0.28
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  chat-1:
    <<: *chat-common
    environment:
      <<: *chat-environment
      CHAT_INSTANCE_NAME: chat-1
    volumes:
      - chat-logs:/app/logs
    ports:
      - "${CHAT_1_PORT:-18081}:8080"

  chat-2:
    <<: *chat-common
    environment:
      <<: *chat-environment
      CHAT_INSTANCE_NAME: chat-2
    volumes:
      - chat-2-logs:/app/logs
    ports:
      - "${CHAT_2_PORT:-18082}:8080"

  chat-lb:
    image: nginx:1.27.5-alpine
    volumes:
      - ./nginx/chat.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${CHAT_PORT:-18080}:8080"
    depends_on:
      chat-1:
        condition: service_healthy
      chat-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/lb-health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 5

  chat-worker:
    <<: *root-backend-common
    environment:
      <<: *backend-environment
      SPRING_PROFILES_ACTIVE: chat-worker
      CHAT_INSTANCE_NAME: chat-worker-1
    volumes:
      - chat-worker-logs:/app/logs

  chat-worker-2:
    <<: *root-backend-common
    environment:
      <<: *backend-environment
      SPRING_PROFILES_ACTIVE: chat-worker
      CHAT_INSTANCE_NAME: chat-worker-2
    volumes:
      - chat-worker-2-logs:/app/logs

  chat-worker-3:
    <<: *root-backend-common
    environment:
      <<: *backend-environment
      SPRING_PROFILES_ACTIVE: chat-worker
      CHAT_INSTANCE_NAME: chat-worker-3
    volumes:
      - chat-worker-3-logs:/app/logs

  chat-persister:
    <<: *root-backend-common
    environment:
      <<: *backend-environment
      SPRING_PROFILES_ACTIVE: chat-persister
      CHAT_INSTANCE_NAME: chat-persister-1
    volumes:
      - chat-persister-logs:/app/logs

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.153.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./monitoring/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  loki:
    image: grafana/loki:3.7.2
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.10.7
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./monitoring/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  mysql-data:
  redis-data:
  mongodb-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  chat-logs:
  chat-2-logs:
  chat-worker-logs:
  chat-worker-2-logs:
  chat-worker-3-logs:
  chat-persister-logs:
