spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_DATABASE_HOST}:${MYSQL_DATABASE_PORT}/${MYSQL_DATABASE_NAME}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: true

  servlet:
    multipart:
      max-request-size: 4096MB
      max-file-size: 4096MB

  data:
    redis:
      host: localhost
      port: 6379
      password:

  application:
    name: webtoon-review

jwt:
  key: ${JWT_KEY}

path:
  file: c://resources//files
  thumbnail: c://resources//thumbnails

domain:
  thumbnail: http://10.0.2.2:8080/webtoons/thumbnails/