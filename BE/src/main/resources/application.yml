spring:
  datasource:
    read:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://${MYSQL_DATABASE_HOST}:${MYSQL_DATABASE_PORT}/${MYSQL_DATABASE_NAME}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      username: ${MYSQL_USERNAME}
      password: ${MYSQL_PASSWORD}
      maximum-pool-size: 7
      minimum-idle: 1
    write:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://${MYSQL_DATABASE_HOST}:${MYSQL_DATABASE_PORT}/${MYSQL_DATABASE_NAME}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatement=true&allowPublicKeyRetrieval=true
      username: ${MYSQL_USERNAME}
      password: ${MYSQL_PASSWORD}
      maximum-pool-size: 2
      minimum-idle: 1
    async-write:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://${MYSQL_DATABASE_HOST}:${MYSQL_DATABASE_PORT}/${MYSQL_DATABASE_NAME}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatement=true&allowPublicKeyRetrieval=true
      username: ${MYSQL_USERNAME}
      password: ${MYSQL_PASSWORD}
      maximum-pool-size: 1
      minimum-idle: 1

  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: true

  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB
      file-size-threshold: 10

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      auto-index-creation: true
  application:
    name: webtoon-review

jwt:
  key: ${JWT_KEY}

path:
  file: c://resources//files
  thumbnail: c://resources//thumbnails

domain:
  thumbnail: http://10.0.2.2:8080/webtoons/thumbnails/

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
  metrics:
    tags:
      service.name: ${spring.application.name}
      service.role: ${chat.role:api}
      service.instance.id: ${server.instance.name:${HOSTNAME:local}}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.role: ${chat.role:api}
      service.instance.id: ${server.instance.name:${HOSTNAME:local}}
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 5s
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0

logging:
  loki:
    url: ${LOKI_URL:http://localhost:3100/loki/api/v1/push}

queue:
  log:
    directory: ${QUEUE_LOG_DIRECTORY:./logs}

firebase:
  config:
    path: classpath:firebase/firebase.json
